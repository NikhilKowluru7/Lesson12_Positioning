<!DOCTYPE html>
<head>
    <title>Animal Rescue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 60px;
        }
        .alert {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: orange;
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
        }
        .zone-label {
            position: sticky;
            top: 50px;
            background: lightgreen;
            padding: 10px;
            font-size: 20px;
        }
        .card {
            position: relative;
            border: 2px solid #ccc;
            margin: 20px;
            padding: 20px;
            background: #f9f9f9;
        }
        .koala {
            position: relative;
            left: 30px;
            top: 10px;
            background: #e8f5e9;
        }
    </style>
</head>
<body>
    <div class="alert">
        Rescue Alert: New animals need assistance!
    </div>

    <div class="zone-label">
        Rescue Zone
    </div>

    <div class="card">
        <h2>Penguin</h2>
        <p>Waiting for transport.</p>
    </div>

    <div class="card koala">
        <h2>Koala</h2>
        <p>Recently rescued and receiving care.</p>
    </div>

    <div class="card">
        <div></div>
        <h2>Panda</h2>
        <p>Healthy and ready for relocation
